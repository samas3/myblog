baseURL: 'https://samas3.github.io'
languageCode: 'zh-cn'
title: "samas3 的网站"
theme: ['PaperMod']

params:
  defaultTheme: dark
  disableThemeToggle: true
  ShowReadingTime: false
  assets:
    disableFingerprinting: true

  avatar: 'avatar.jpg'
  avatarURL: 'https://github.com/samas3'
  
  # 导航栏菜单
menu:
  main:
    - identifier: home
      name: 首页
      url: "/"
      weight: 1
    - identifier: posts
      name: 博客
      url: "/posts/"
      weight: 2
    - identifier: homepage
      name: 关于
      url: "/about/"
      weight: 3

# 允许嵌入 HTML (如果你迁移了旧 HTML 页面)
markup:
  goldmark:
    renderer:
      unsafe: true

publishDir: "../samas3.github.io"